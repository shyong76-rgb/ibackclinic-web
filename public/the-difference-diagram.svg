<svg viewBox="0 0 980 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dt dd" font-family="Pretendard, -apple-system, sans-serif">
  <title id="dt">눈밑지방 시술 방식 비교 단면도</title>
  <desc id="dd">기존 캐뉼라 터널링 방식과 아이백의원 특수절연침 관통 방식을 눈밑 단면 구조로 비교. 왼쪽은 캐뉼라가 안와격막 위 층에서 멈춰 지방층에 도달하지 못하고, 오른쪽은 절연침이 피부·안륜근·안와격막을 지나 지방층 내부까지 직접 도달해 고주파 에너지를 전달한다.</desc>

  
  <text x="235" y="34" text-anchor="middle" font-size="12" font-weight="500" fill="#a1968a" letter-spacing="0.3">기존 방식 · 캐뉼라 터널링</text>
  <text x="745" y="34" text-anchor="middle" font-size="14" font-weight="700" fill="#8a7654" letter-spacing="0.3">아이백의원 · 특수절연침 관통(이노플러스)</text>

  
  <g transform="translate(40,55)" opacity="0.85">
    <rect x="0" y="0" width="390" height="360" rx="16" fill="#faf8f5" stroke="#e3dbcc" stroke-width="1"></rect>

    
    <rect x="24" y="30" width="342" height="46" rx="6" fill="#f1ece2"></rect>
    <rect x="24" y="76" width="342" height="52" rx="6" fill="#f1ece2" opacity="0.75"></rect>
    <rect x="24" y="128" width="342" height="18" fill="#e3dbcc" opacity="0.8"></rect>

    
    <ellipse cx="195" cy="235" rx="150" ry="88" fill="#f1ece2" stroke="#e3dbcc" stroke-width="1" stroke-dasharray="3 4"></ellipse>

    
    <line x1="24" y1="53" x2="6" y2="53" stroke="#8a7f72"></line>
    <text x="2" y="57" text-anchor="end" font-size="12" font-weight="500" fill="#443a35">피부</text>

    <line x1="24" y1="102" x2="6" y2="102" stroke="#8a7f72"></line>
    <text x="2" y="106" text-anchor="end" font-size="12" font-weight="500" fill="#443a35">안륜근</text>

    <line x1="24" y1="137" x2="6" y2="137" stroke="#8a7f72"></line>
    <text x="2" y="141" text-anchor="end" font-size="12" font-weight="500" fill="#443a35">안와격막</text>

    <line x1="45" y1="235" x2="6" y2="235" stroke="#8a7f72"></line>
    <text x="2" y="239" text-anchor="end" font-size="12" font-weight="500" fill="#443a35">안와지방</text>

    
    <path d="M 366 108 C 300 118, 250 128, 210 150" fill="none" stroke="#443a35" stroke-width="5" stroke-linecap="round"></path>
    <circle cx="210" cy="150" r="6" fill="#443a35"></circle>

    
    <ellipse cx="235" cy="150" rx="55" ry="22" fill="none" stroke="#6b5d54" stroke-width="1.5" stroke-dasharray="2 4"></ellipse>

    <text x="195" y="332" text-anchor="middle" font-size="13" font-weight="600" fill="#443a35">지방층 도달 안 함</text>
    <text x="195" y="350" text-anchor="middle" font-size="11" fill="#8c8078">조직 사이 공간만 형성</text>
  </g>

  
  <g transform="translate(550,55)">
    <rect x="-6" y="-6" width="402" height="372" rx="20" fill="none" stroke="#aa9371" stroke-width="1" opacity="0.35"></rect>
    <rect x="0" y="0" width="390" height="360" rx="16" fill="#fffdf9" stroke="#aa9371" stroke-width="1.6"></rect>

    <rect x="24" y="30" width="342" height="46" rx="6" fill="#efe8dc"></rect>
    <rect x="24" y="76" width="342" height="52" rx="6" fill="#e9e0d1"></rect>
    <rect x="24" y="128" width="342" height="18" fill="#d8ccb6"></rect>

    <ellipse cx="195" cy="235" rx="150" ry="88" fill="#f6f0e6" stroke="#c9b898" stroke-width="1.4" stroke-dasharray="4 4"></ellipse>

    
    <line x1="195" y1="10" x2="195" y2="228" stroke="#8a7654" stroke-width="7" stroke-linecap="round"></line>

    
    <g stroke="#aa9371" stroke-width="2.6" fill="none">
      <circle cx="195" cy="235" r="14"></circle>
      <circle cx="195" cy="235" r="26" opacity="0.7"></circle>
      <circle cx="195" cy="235" r="38" opacity="0.45"></circle>
      <circle cx="195" cy="235" r="52" opacity="0.22"></circle>
    </g>
    <circle cx="195" cy="235" r="8" fill="#8a7654"></circle>

    
    <circle cx="150" cy="215" r="3" fill="#aa9371" opacity="0.5"></circle>
    <circle cx="235" cy="255" r="3" fill="#aa9371" opacity="0.4"></circle>
    <circle cx="165" cy="260" r="2.5" fill="#aa9371" opacity="0.3"></circle>
    <circle cx="220" cy="205" r="2.5" fill="#aa9371" opacity="0.3"></circle>

    <text x="195" y="330" text-anchor="middle" font-size="16" font-weight="700" fill="#443a35">지방층 직접 도달</text>
    <text x="195" y="350" text-anchor="middle" font-size="12" fill="#6b5d54">단극성 고주파로 선택적 융해</text>
  </g>

  
  <g transform="translate(490,60)">
    <line x1="0" y1="0" x2="0" y2="360" stroke="#e3dbcc" stroke-dasharray="2 5" opacity="0.6"></line>
  </g>
  <text x="490" y="460" text-anchor="middle" font-size="10" fill="#8c8078">동일한 눈밑 해부학적 단면 기준 비교 · 실제 개인차가 있을 수 있음</text>
</svg>